name: Publish Path Restore

'on':
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: path-restore-pages
  cancel-in-progress: false

jobs:
  prepare:
    if: github.repository == 'renegomezjr/pathrestore-website-improved-carnival' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Confirm the run targets current main
        run: |
          if [ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]; then
            echo "::error::Main has advanced. Run the workflow on current main to publish."
            exit 1
          fi
      - name: Prepare static files and generate sitemap
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/site"
          git archive HEAD -- . ':(exclude).github' ':(exclude)scripts' | tar -x -C "$RUNNER_TEMP/site"
          python3 scripts/search_discovery.py sitemap "$RUNNER_TEMP/site"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/site
          include-hidden-files: true

  deploy:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: pages
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  discover:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Find the last deployment with successful discovery
        id: previous
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          previous=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/pages.yml/runs?branch=main&status=success&per_page=1" --jq '.workflow_runs[0].head_sha // empty')
          # Last successful branch-based deployment before this workflow was added.
          printf 'sha=%s\n' "${previous:-a54e5fd9db8fe94d437b9e397f65447128f341ce}" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
          check-latest: true
      - name: Validate live articles and submit to IndexNow
        env:
          PREVIOUS_SHA: ${{ steps.previous.outputs.sha }}
        run: python scripts/search_discovery.py notify "$PREVIOUS_SHA"
